<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Egypt Visa</title>
    <!-- استدعاء خط Cairo وأيقونات FontAwesome للأين المخصصة لكلمة المرور -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* الشعار */
        .logo-box {
            margin-bottom: 40px;
            text-align: center;
        }

        .logo-box img {
            max-width: 220px;
            height: auto;
        }

        /* النموذج */
        .login-form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #5d839c;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: right;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-control {
            width: 100%;
            height: 48px;
            padding: 10px 16px;
            border: 2px solid #3381a8;
            border-radius: 8px;
            font-size: 15px;
            color: #333;
            outline: none;
            background-color: #ffffff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control::placeholder {
            color: #bdc8d0;
        }

        .form-control:focus {
            border-color: #1e5e82;
            box-shadow: 0 0 0 3px rgba(51, 129, 168, 0.15);
        }

        /* تعديل المسافة للأيقونة إذا وجدت */
        .input-wrapper.has-icon .form-control {
            padding-left: 45px;
        }

        /* أيقونة عين كلمة السر */
        .toggle-password {
            position: absolute;
            left: 14px;
            color: #3381a8;
            cursor: pointer;
            font-size: 18px;
            user-select: none;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: #1e5e82;
        }

        /* زر تسجيل الدخول */
        .btn-submit {
            width: 100%;
            height: 48px;
            background-color: #277da1;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #1f6381;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- الشعار -->
        <div class="logo-box">
            <!-- استبدل logo.png بمسار الصورة الخاص بك -->
            <img src="https://eg-visa.com/images/Logo.png" alt="Egypt Visa Logo">
        </div>

        <!-- نموذج الدخول -->
        <form class="login-form" onsubmit="handleSubmit(event)">
            
            <!-- اسم المستخدم -->
            <div class="form-group">
                <label for="username">اسم المستخدم</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="username" 
                        class="form-control" 
                        placeholder="أدخل اسم المستخدم" 
                        required
                        autocomplete="off"
                    >
                </div>
            </div>

            <!-- كلمة المرور -->
            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <div class="input-wrapper has-icon">
                    <input 
                        type="password" 
                        id="password" 
                        class="form-control" 
                        placeholder="أدخل كلمة السر" 
                        required
                    >
                    <i class="fa-regular fa-eye toggle-password" id="toggleIcon" onclick="togglePasswordVisibility()"></i>
                </div>
            </div>

            <!-- زر الدخول -->
            <button type="submit" class="btn-submit">تسجيل الدخول</button>

        </form>
    </div>

    <script>
        // إظهار وإخفاء كلمة المرور
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // معالجة الإرسال
        function handleSubmit(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            alert('تم الضغط على تسجيل الدخول للمستخدم: ' + username);
        }
    </script>
</body>
</html>
